
name: S10 - Cosign Sign and Verify

on:
  push:
    branches:
      - feature/cosign-verify-s10

  workflow_dispatch:

jobs:
  sign-and-verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ginalef-ui/meditriage-backend:s10-cosign-${{ github.sha }}

      - name: Firmar imagen
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/ginalef-ui/meditriage-backend@$DIGEST"
          cosign sign --yes "$IMAGE"

      - name: Verificar firma
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/ginalef-ui/meditriage-backend@$DIGEST"

          cosign verify \
            --certificate-identity \
            "https://github.com/ginalef-ui/MediTriage/.github/workflows/cosign-verify.yml@refs/heads/feature/cosign-verify-s10" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            "$IMAGE"
