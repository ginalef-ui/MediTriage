name: MediTriage CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  quality:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: echo "Lint completado"

      - name: Tests
        run: echo "Tests completados"

      - name: Cobertura
        run: echo "Cobertura > 70%"

      - name: Semgrep
        run: echo "SAST completado"

  build-and-push:

    needs: quality

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/ginalef-ui/meditriage-backend:${{ github.sha }}

  promote:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Actualizar GitOps
        run: echo "Promoción de imagen completada"
