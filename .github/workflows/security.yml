name: Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  sast:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: SAST - Semgrep
        run: |
          echo "Ejecutando Semgrep"

  sca:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: SCA - Trivy
        run: |
          echo "Ejecutando Trivy"

  secrets:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Secret Scan - Gitleaks
        run: |
          echo "Ejecutando Gitleaks"

  iac-scan:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: IaC Scan - Checkov
        run: |
          echo "Escaneando Terraform y Kubernetes"

  container-scan:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Container Scan - Trivy Image
        run: |
          echo "Escaneando imagen Docker"

  sign-and-attest:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Firma con Cosign
        run: |
          echo "Firmando imagen"

      - name: Verificación Cosign
        run: |
          echo "Verificando firma"

  dast:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: DAST - OWASP ZAP
        run: |
          echo "Ejecutando análisis dinámico"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar SBOM (CycloneDX) con Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft . -o cyclonedx-json=sbom.json

      - name: Subir artefacto SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
