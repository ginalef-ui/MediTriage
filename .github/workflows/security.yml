# ... (Jobs previos: sast, sca, secrets) ...

  build_and_scan:
    name: Build & Container Scan
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets] # Esperar a que pase el shift-left
    permissions:
      contents: read
      packages: write
      id-token: write # Requerido para keyless signing con Cosign
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: IaC Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          
      - name: Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  sign_and_attest:
    name: Sign Image and Generate Attestation
    runs-on: ubuntu-latest
    needs: build_and_scan
    permissions:
      packages: write
      id-token: write # Requerido para OIDC
    steps:
      - uses: sigstore/cosign-installer@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Sign the published Docker image
        env:
          TAGS: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          cosign sign --yes ${TAGS}
          cosign verify --certificate-identity-regexp ".*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" ${TAGS}

      # Generar attestation SLSA Nivel 2
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: true
