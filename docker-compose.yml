version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meditriage-postgres
    environment:
      POSTGRES_DB: meditriage_db
      POSTGRES_USER: meditriage_user
      POSTGRES_PASSWORD: meditriage_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_outbox.sql:/docker-entrypoint-initdb.d/init_outbox.sql

  kafka:
    image: bitnami/kafka:3.5
    container_name: meditriage-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

volumes:
  postgres_data:
