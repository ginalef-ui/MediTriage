apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditriage-backend
  labels:
    app: meditriage-backend
    iniciativa: meditriage
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meditriage-backend
  template:
    metadata:
      labels:
        app: meditriage-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ginalef-ui/meditriage-backend@sha256:50e0fc6ea629379e39a11fdacbfcbd5cd29eade53b88973826c767c95d3dbae7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: meditriage-config
            - secretRef:
                name: meditriage-secrets
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
